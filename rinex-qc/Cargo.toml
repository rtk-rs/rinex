[package]
name = "rinex-qc"
version = "0.2.0-alpha-1"
license = "MIT OR Apache-2.0"
authors = ["Guillaume W. Bres <guillaume.bressaix@gmail.com>"]
description = "RINEX and more broadly, GNSS data processing"
homepage = "https://github.com/georust/rinex"
repository = "https://github.com/georust/rinex"
keywords = ["rinex", "gnss", "gps", "glonass", "galileo"]
categories = ["science", "science::geo", "parsing"]
edition = "2021"
rust-version = "1.89"

[features]

default = [
  "all",
]

# Enable all features at once
all = [
    "html",
    "sp3",
    "flate2",
    "nav",
    "cggtts",
]

# Support of SP3 High Precision Orbital fileset.
# This will enable true PPP.
sp3 = ["dep:sp3"]

# flate2 features allows to stack User Data from
# .gzip compressed files natively
flate2 = [
    "sp3?/flate2",
    "rinex/flate2",
]

# unlock HTML report rendition. This is enabled by default,
# since HTML is the only format currently supported.
html = [
    "dep:maud",
    "dep:plotly",
    "rinex-qc-traits/html",
]

# Support for post processed navigation solutions.
# Allows to integrate the solutions to the analysis.
nav = [
    "rinex/nav",
    "dep:gnss-rtk",
    "dep:anise",
    "dep:platform-dirs",
]

# Support special timing solutions.
# Allows to integrate the solutions to the analysis.
cggtts = [
    "dep:gnss-rtk", 
    "dep:cggtts",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docrs", "--generate-link-to-definition"]

[dependencies]
log = "0.4"
map_3d = "0.1.5"
regex = "1"
thiserror = "2"
strum = "0.26"
itertools = "0.14.0"
strum_macros = "0.26"
hifitime = "4.0.0"
gnss-rs = { version = "2.3.1", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

maud = { version = "0.26", optional = true }
plotly = { version = "0.12", optional = true }
anise = { version = "0.6", features = ["embed_ephem"], optional = true }
# same crate and version as anise: locates its downloads
platform-dirs = { version = "0.3", optional = true }

gnss-rtk = { version = "=0.8.0", features = ["serde"], optional = true }

cggtts = { version = "=4.4.0", features = ["serde", "scheduler"], optional = true }

rinex = { path = "../rinex", version = "=0.17.0-alpha-1", features = ["serde"] }
rinex-qc-traits = { path = "../qc-traits", version = "=0.2.1", features = ["processing"] }

sp3 = { path = "../sp3", version = "=1.1.0-alpha-1", features = ["qc", "processing", "serde"], optional = true }

[dev-dependencies]
serde_json = "1"
